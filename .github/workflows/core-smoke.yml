name: Reborn Core smoke tests
# Avoid duplicate push+PR builds. GitHub Actions is a verification gate,
# not a job on every development commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run deterministic Core checks
        run: dotnet run --project tools/Reborn.Core.Smoke/Reborn.Core.Smoke.csproj --configuration Release

      - name: Compile the Core public API from a different C# assembly
        run: dotnet run --project tools/Reborn.CrossAssembly.Smoke/Reborn.CrossAssembly.Smoke.csproj --configuration Release

      - name: Check presentation boundaries (static only)
        run: python3 tools/check_presentation_contracts.py

      - name: Check 0.6 card visuals (static only)
        run: python3 tools/check_card_visuals.py

      - name: Validate private disc importer entry point
        run: |
          python3 -m py_compile tools/import_fm_disc.py
          python3 tools/import_fm_disc.py --help > /dev/null
          python3 tools/test_disc_import.py

      - name: Check adaptive AI wiring (static, not Unity compilation)
        run: python3 tools/check_adaptive_ai.py

      - name: Verify combat forecast integration (static only)
        run: python3 tools/check_combat_forecast.py

      - name: Verify tactical attack preview integration (static only)
        run: python3 tools/check_tactical_preview.py

      - name: Verify bounded multistep AI planner (static only)
        run: python3 tools/check_multiattack.py

      - name: Verify PS1-like fluent duel and fanned hand contracts (static only)
        run: python3 tools/check_fluent_duel.py

      - name: Verify responsive inverted hand fan (static only)
        run: python3 tools/check_responsive_hand_fan.py

      - name: Verify legal field targets and summon motion (static only)
        run: python3 tools/check_field_interaction.py

      - name: Verify legal attack aim (static only)
        run: python3 tools/check_attack_aim.py

      - name: Verify mandatory turns and card inspection (static only)
        run: python3 tools/check_classic_turn_inspection.py

      - name: Verify field-first fusion and full-board play (static only)
        run: python3 tools/check_field_fusions.py

      - name: Verify original disc descriptions, rituals and ceremonies (static only)
        run: python3 tools/check_original_data_rituals.py

      - name: Test DUELTRACE original catalog bridge (synthetic data only)
        run: |
          python3 -m py_compile tools/import_dueltrace_profile.py
          python3 tools/import_dueltrace_profile.py --help > /dev/null
          python3 tools/test_dueltrace_bridge.py

      - name: Verify Original content startup and explicit demo consent (static)
        run: python3 tools/check_dueltrace_autoload.py

      - name: Verify 0.18 four-starter decks and transactional placement (static)
        run: |
          python3 tools/check_card_flow_starter.py
          python3 tools/test_starter_export.py

      - name: Verify hidden monsters stay concealed until combat
        run: python3 tools/check_hidden_stance.py

      - name: Verify 0.19 audited Original spell effects
        run: python3 tools/check_verified_spell_effects.py

      - name: Verify 0.20 original Equip rules and state
        run: python3 tools/check_original_equips.py

      - name: Verify 0.21 fields and automatic threshold traps
        run: python3 tools/check_terrain_traps.py

      - name: Verify 0.22 reflective and healing-inversion Traps
        run: python3 tools/check_reactive_traps.py

      - name: Verify 0.23 Equip export and restored PS1 monster types
        run: |
          python3 tools/test_equip_export.py
          python3 tools/check_complete_equip_import.py

      - name: Verify 0.24 rebindable keyboard, ordered fusion and auto-slot
        run: python3 tools/check_keyboard_fusion_v024.py

      - name: Prevent Unity MonoBehaviour constructor PlayerPrefs regression
        run: python3 tools/check_keyboard_init_v0241.py

      - name: QA 0.24.2 — Q/E stable positions and safe local fusion diagnostics
        run: |
          python3 tools/test_fusion_diagnostics.py
          python3 tools/check_duel_qa_v0242.py

      - name: Guard Unity EditMode assembly references (CS0234)
        run: python3 tools/check_unity_editor_asmdef.py

      - name: Verify 0.25 validated fusion assistant and safe auto-selection
        run: python3 tools/check_fusion_assistant_v025.py

      - name: Verify v0.26 complete ordered fusion chains (static only)
        run: python3 tools/check_fusion_chains_v026.py

      - name: Verify v0.27 adaptive fusion decisions and opponent VFX (static)
        run: python3 tools/check_ai_fusion_v027.py

      - name: Check 0.28 opponent fusion streams and minimum animation pacing
        run: python3 tools/check_opponent_vfx_v028.py

      - name: Prevent Unity C# test syntax error CS0819
        run: python3 tools/check_unity_editor_csharp_syntax.py

      - name: AI Lab deterministic regression
        run: dotnet run --project tools/Reborn.AiLab/Reborn.AiLab.csproj --configuration Release -- --self-test

      - name: Generate multi-seed scenario comparison (synthetic cards only)
        run: dotnet run --project tools/Reborn.AiLab/Reborn.AiLab.csproj --configuration Release -- --batch --seeds 10 --train 20 --eval 25 --seed 1209 --scenarios balanced,defensive,aggressive --out ai-lab/batch.json --csv ai-lab/batch.csv

      - name: Validate AI Lab report and paired seed accounting
        run: python3 tools/check_ai_lab_report.py ai-lab/batch.json ai-lab/batch.csv

      - name: Publish expanded AI Lab report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Reborn-0.16-AiLab-MultiSeed
          retention-days: 90
          if-no-files-found: error
          path: |
            ai-lab/batch.json
            ai-lab/batch.csv

      - name: Archive clean Unity source (never ROMs or private content)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Reborn-0.16-Clean-Source
          retention-days: 90
          if-no-files-found: error
          path: |
            .github/
            .gitignore
            Assets/
            Docs/
            Packages/
            ProjectSettings/
            tools/
            README.md
            !tools/**/bin/**
            !tools/**/obj/**
            !Assets/StreamingAssets/RebornContent/**
            !PrivateExtracts/**
