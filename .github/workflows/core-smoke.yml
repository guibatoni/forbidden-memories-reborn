name: Reborn Core smoke tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run deterministic Core checks
        run: dotnet run --project tools/Reborn.Core.Smoke/Reborn.Core.Smoke.csproj --configuration Release

      - name: Compile the Core public API from a different C# assembly
        run: dotnet run --project tools/Reborn.CrossAssembly.Smoke/Reborn.CrossAssembly.Smoke.csproj --configuration Release

      - name: Check presentation boundaries (static only)
        run: python3 tools/check_presentation_contracts.py

      - name: Check 0.6 card visuals (static only)
        run: python3 tools/check_card_visuals.py

      - name: Validate private disc importer entry point
        run: |
          python3 -m py_compile tools/import_fm_disc.py
          python3 tools/import_fm_disc.py --help > /dev/null
          python3 tools/test_disc_import.py

      - name: Check adaptive AI wiring (static, not Unity compilation)
        run: python3 tools/check_adaptive_ai.py

      - name: Verify combat forecast integration (static only)
        run: python3 tools/check_combat_forecast.py

      - name: Verify tactical attack preview integration (static only)
        run: python3 tools/check_tactical_preview.py

      - name: Verify bounded multistep AI planner (static only)
        run: python3 tools/check_multiattack.py

      - name: Verify PS1-like fluent duel and fanned hand contracts (static only)
        run: python3 tools/check_fluent_duel.py

      - name: Verify responsive inverted hand fan (static only)
        run: python3 tools/check_responsive_hand_fan.py

      - name: Verify legal field targets and summon motion (static only)
        run: python3 tools/check_field_interaction.py

      - name: Verify legal attack aim (static only)
        run: python3 tools/check_attack_aim.py

      - name: Verify mandatory turns and card inspection (static only)
        run: python3 tools/check_classic_turn_inspection.py

      - name: Verify field-first fusion and full-board play (static only)
        run: python3 tools/check_field_fusions.py

      - name: Verify original disc descriptions, rituals and ceremonies (static only)
        run: python3 tools/check_original_data_rituals.py

      - name: Disc-free importer and full-content validator
        run: python3 tools/test_disc_import.py

      - name: AI Lab deterministic regression
        run: dotnet run --project tools/Reborn.AiLab/Reborn.AiLab.csproj --configuration Release -- --self-test

      - name: Generate multi-seed scenario comparison (synthetic cards only)
        run: dotnet run --project tools/Reborn.AiLab/Reborn.AiLab.csproj --configuration Release -- --batch --seeds 10 --train 20 --eval 25 --seed 1209 --scenarios balanced,defensive,aggressive --out ai-lab/batch.json --csv ai-lab/batch.csv

      - name: Validate AI Lab report and paired seed accounting
        run: python3 tools/check_ai_lab_report.py ai-lab/batch.json ai-lab/batch.csv

      - name: Publish expanded AI Lab report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Reborn-0.16-AiLab-MultiSeed
          retention-days: 90
          if-no-files-found: error
          path: |
            ai-lab/batch.json
            ai-lab/batch.csv

      - name: Archive clean Unity source (never ROMs or private content)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Reborn-0.16-Clean-Source
          retention-days: 90
          if-no-files-found: error
          path: |
            .github/
            .gitignore
            Assets/
            Docs/
            Packages/
            ProjectSettings/
            tools/
            README.md
            !tools/**/bin/**
            !tools/**/obj/**
            !Assets/StreamingAssets/RebornContent/**
            !PrivateExtracts/**
