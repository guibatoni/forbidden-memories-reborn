name: Reborn Core smoke tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run deterministic Core checks
        run: dotnet run --project tools/Reborn.Core.Smoke/Reborn.Core.Smoke.csproj --configuration Release

      - name: Check presentation boundaries (static only)
        run: python3 tools/check_presentation_contracts.py

      - name: Check 0.6 card visuals (static only)
        run: python3 tools/check_card_visuals.py

      - name: Validate private disc importer entry point
        run: |
          python3 -m py_compile tools/import_fm_disc.py
          python3 tools/import_fm_disc.py --help > /dev/null
          python3 tools/test_disc_import.py

      - name: Check adaptive AI wiring (static, not Unity compilation)
        run: python3 tools/check_adaptive_ai.py

      - name: Verify combat forecast integration (static only)
        run: python3 tools/check_combat_forecast.py

      - name: Verify tactical attack preview integration (static only)
        run: python3 tools/check_tactical_preview.py

      - name: Verify bounded multistep AI planner (static only)
        run: python3 tools/check_multiattack.py

      - name: Archive clean Unity source (never ROMs or private content)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Reborn-0.11-Clean-Source
          retention-days: 90
          if-no-files-found: error
          path: |
            .github/
            .gitignore
            Assets/
            Docs/
            Packages/
            ProjectSettings/
            tools/
            README.md
